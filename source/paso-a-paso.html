<title>Paso a Paso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout : jeu mobile en une colonne (max 560px). Barre d'état collée en haut, parcours en zigzag d'étapes rondes, onglets collés en bas. Palette : rose mexicain, turquoise et jaune casque de chantier. */
:root{
  --bg:#f7f5fb; --surface:#ffffff; --sunk:#efebf6; --ink:#221c35; --muted:#6c6582; --line:#e3ddee;
  --pink:#e4007c; --pink-deep:#a6005a; --pink-soft:#fde2f0;
  --teal:#00a99d; --teal-deep:#00786f; --teal-soft:#d4f3f0;
  --sun:#ffb81c; --sun-deep:#d48a00; --sun-soft:#fff0cc; --sun-ink:#3d2600;
  --blue:#3a72e0; --blue-deep:#2450a8; --blue-soft:#dfe8fb;
  --ok:#14a26b; --ok-deep:#0b774d; --ok-bg:#d8f5e7;
  --bad:#e0402e; --bad-deep:#a3281b; --bad-bg:#fde3df;
  --lock:#dcd6e6; --lock-deep:#bdb5cc;
  --on:#ffffff; --eye:#221c35;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141022; --surface:#1f1933; --sunk:#2a2342; --ink:#f2eefa; --muted:#a69dbf; --line:#352d51;
  --pink:#ff3d9e; --pink-deep:#b1166b; --pink-soft:#3d1631;
  --teal:#21c6b8; --teal-deep:#0f897f; --teal-soft:#103633;
  --sun:#ffc23d; --sun-deep:#c88800; --sun-soft:#3a2d0c; --sun-ink:#2a1a00;
  --blue:#5b8ff0; --blue-deep:#2f5cbc; --blue-soft:#1b2747;
  --ok:#2bcf8a; --ok-deep:#139260; --ok-bg:#10301f;
  --bad:#ff6a57; --bad-deep:#b5382a; --bad-bg:#3b1813;
  --lock:#3a3352; --lock-deep:#29233f;
  --on:#ffffff; --eye:#141022; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141022; --surface:#1f1933; --sunk:#2a2342; --ink:#f2eefa; --muted:#a69dbf; --line:#352d51;
  --pink:#ff3d9e; --pink-deep:#b1166b; --pink-soft:#3d1631;
  --teal:#21c6b8; --teal-deep:#0f897f; --teal-soft:#103633;
  --sun:#ffc23d; --sun-deep:#c88800; --sun-soft:#3a2d0c; --sun-ink:#2a1a00;
  --blue:#5b8ff0; --blue-deep:#2f5cbc; --blue-soft:#1b2747;
  --ok:#2bcf8a; --ok-deep:#139260; --ok-bg:#10301f;
  --bad:#ff6a57; --bad-deep:#b5382a; --bad-bg:#3b1813;
  --lock:#3a3352; --lock-deep:#29233f;
  --on:#ffffff; --eye:#141022; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
.eyebrow{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Boutons 3D */
.btn{--c:var(--pink);--d:var(--pink-deep);border:0;border-radius:16px;padding:13px 20px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--c);color:var(--on);box-shadow:0 4px 0 var(--d);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn:disabled{--c:var(--lock);--d:var(--lock-deep);color:var(--muted);cursor:default}
.btn.teal{--c:var(--teal);--d:var(--teal-deep)}
.btn.sun{--c:var(--sun);--d:var(--sun-deep);color:var(--sun-ink)}
.btn.blue{--c:var(--blue);--d:var(--blue-deep)}
.btn.ok{--c:var(--ok);--d:var(--ok-deep)}
.btn.bad{--c:var(--bad);--d:var(--bad-deep)}
.btn.line{--c:var(--surface);--d:var(--line);color:var(--muted);border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}

/* Barre d'état */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.chip{display:flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;background:none;border:0;padding:4px 6px;border-radius:10px}
.chip svg{width:24px;height:24px}
.chip.flame{color:var(--sun-deep)} .chip.flame.off{color:var(--muted)}
.chip.peso{color:var(--teal-deep)}
.chip.lvl{color:var(--pink)}
.boost{font-size:12px;font-weight:800;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:2px 8px;font-family:var(--font-display)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:560px}
.tab{border:2px solid transparent;background:none;border-radius:14px;padding:6px;display:grid;justify-items:center;gap:0;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted);position:relative}
.tab svg{width:28px;height:28px}
.tab.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 22px);width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

/* Parcours */
.goalcard{margin-top:16px;display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.goalcard .txt{flex:1;min-width:0}
.goalcard b{font-family:var(--font-display);font-size:18px;display:block;line-height:1.1}
.goalcard small{color:var(--muted)}
.pbar{height:16px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--sun));transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.review{margin-top:12px;display:flex;align-items:center;gap:12px;background:var(--teal-soft);border-radius:20px;padding:12px 14px}
.review .txt{flex:1;min-width:0}
.review b{font-family:var(--font-display);font-size:18px;display:block;line-height:1.1}
.review small{color:var(--muted)}
.unit-banner{margin-top:28px;border-radius:20px;padding:14px 16px;background:var(--uc);color:var(--on);box-shadow:0 4px 0 var(--ud);display:flex;gap:12px;align-items:center}
.unit-banner .txt{flex:1;min-width:0}
.unit-banner .eyebrow{color:var(--on);opacity:.85}
.unit-banner h2{font-size:24px;font-weight:800}
.unit-banner p{margin:0;opacity:.9;font-weight:700}
.unit-banner.locked{--uc:var(--lock);--ud:var(--lock-deep);color:var(--muted)}
.unit-banner.locked .eyebrow{color:var(--muted)}
.floors{display:grid;justify-items:center;gap:18px;padding-block:64px 4px}
.node-wrap{position:relative;display:grid;justify-items:center}
.node-wrap.p1{transform:translateX(64px)} .node-wrap.p3{transform:translateX(-64px)}
.node{width:74px;height:70px;border-radius:50%;border:0;background:var(--uc);box-shadow:0 7px 0 var(--ud);color:var(--on);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .08s}
.node svg.ic{width:34px;height:34px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--ud)}
.node.done{--uc:var(--sun);--ud:var(--sun-deep);color:var(--sun-ink)}
.node.locked{--uc:var(--lock);--ud:var(--lock-deep);color:var(--muted);cursor:default}
.node-ring{position:absolute;inset:-12px;pointer-events:none}
.bubble{position:absolute;bottom:calc(100% + 18px);white-space:nowrap;background:var(--surface);color:var(--uc2,var(--pink));border:2px solid var(--line);border-radius:12px;padding:5px 12px;font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.locknote{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:8px}
.notice{background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:12px;display:grid;gap:8px}
.notice b{font-family:var(--font-display);font-size:16px}

/* Défis & profil */
.section-title{font-size:24px;font-weight:800;margin-top:24px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:12px}
.quest{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding-block:10px}
.quest + .quest{border-top:2px solid var(--line)}
.qicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-deep)}
.qicon svg{width:26px;height:26px}
.quest b{font-weight:800;display:block;margin-bottom:6px;font-size:15px}
.quest .pbar{height:12px}
.quest .reward{font-family:var(--font-display);font-weight:800;color:var(--teal-deep);font-size:15px;display:flex;align-items:center;gap:3px}
.quest .reward svg{width:18px;height:18px}
.quest.claimed{opacity:.55}
.chest{display:flex;align-items:center;gap:14px}
.chest svg.big{width:64px;height:64px;flex:none}
.chest .txt{flex:1;min-width:0}
.chest b{font-family:var(--font-display);font-size:18px;display:block}
.chest.ready svg.big{animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:8px 4px;font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.1}
.seg button small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--muted)}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.shop{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:10px}
.shop + .shop{border-top:2px solid var(--line)}
.shop .art{width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.shop .art svg{width:32px;height:32px}
.shop b{font-weight:800;display:block}
.shop small{color:var(--muted)}
.levelcard{display:flex;gap:16px;align-items:center}
.lvbadge{width:84px;height:84px;flex:none;border-radius:24px;background:var(--pink);box-shadow:0 5px 0 var(--pink-deep);color:var(--on);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:40px;transform:rotate(-4deg)}
.levelcard .txt{flex:1;min-width:0;display:grid;gap:6px}
.levelcard h2{font-size:26px}
.levelcard small{color:var(--muted);font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stat svg{width:28px;height:28px;flex:none}
.stat b{font-family:var(--font-display);font-size:22px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.badge{display:grid;justify-items:center;text-align:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--bc);box-shadow:0 4px 0 var(--bd);color:var(--on)}
.badge .medal svg{width:28px;height:28px}
.badge b{font-size:13px;font-weight:800;line-height:1.15}
.badge small{font-size:11px;color:var(--muted);line-height:1.2}
.badge.locked .medal{--bc:var(--lock);--bd:var(--lock-deep);color:var(--muted)}
.badge.locked b{color:var(--muted)}
.voice{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:8px}
.voice + .voice{border-top:2px solid var(--line)}
.voice label{display:flex;gap:10px;align-items:center;min-width:0;cursor:pointer}
.voice input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.voice .nm{font-weight:800;overflow-wrap:anywhere}
.q{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.q.top{background:var(--ok-bg);color:var(--ok-deep)} .q.mid{background:var(--sun-soft);color:var(--sun-deep)} .q.low{background:var(--bad-bg);color:var(--bad-deep)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.row + .row{border-top:2px solid var(--line)}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--lock);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--on);transition:left .15s}
.switch.on{background:var(--ok)} .switch.on::after{left:25px}

/* Leçon */
.lesson-top{display:flex;align-items:center;gap:12px;padding-top:8px}
.x{border:0;background:none;color:var(--muted);padding:4px;display:grid;place-items:center}
.x svg{width:28px;height:28px}
.lbar{flex:1}
.combo{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--sun-deep);display:flex;align-items:center;gap:2px;min-width:52px;justify-content:flex-end}
.combo svg{width:22px;height:22px}
.combo.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.35)}}
.combo-banner{color:var(--sun-deep);font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;min-height:22px}
.stage{margin-top:18px;display:grid;gap:20px}
.prompt-label{font-family:var(--font-display);font-size:26px;font-weight:800}
.tagnew{justify-self:start;display:flex;gap:6px;align-items:center;color:var(--pink);font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.tagnew svg{width:20px;height:20px}
.scene{display:flex;align-items:flex-end;gap:10px}
.scene .mascot{width:110px;flex:none}
.speech{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;margin-bottom:20px;background:var(--surface)}
.speech::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speech .big{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.speech .fr{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.speak{width:44px;height:44px;border-radius:12px;border:0;background:var(--blue);box-shadow:0 3px 0 var(--blue-deep);color:var(--on);display:grid;place-items:center;flex:none}
.speak:active{transform:translateY(3px);box-shadow:none}
.speak svg{width:24px;height:24px}
.listen-row{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding-block:6px}
.listen-row .speak{width:104px;height:104px;border-radius:26px;box-shadow:0 6px 0 var(--blue-deep)}
.listen-row .speak svg{width:52px;height:52px}
.listen-row .speak.slow{width:64px;height:64px;border-radius:18px;background:var(--blue-soft);color:var(--blue);box-shadow:0 5px 0 var(--line)}
.listen-row .speak.slow svg{width:32px;height:32px}
.options{display:grid;gap:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;transition:transform .06s}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px;align-content:start}
.match .opt{text-align:center;padding:14px 8px;font-size:16px}
.opt.done{opacity:.3;border-color:var(--line);background:var(--surface);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .3s}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-deep)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:120px;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:8px 14px;font-size:18px;font-weight:700;height:48px}
.tile.ghosted{background:var(--sunk);color:transparent;border-color:var(--sunk);box-shadow:none;cursor:default}
.type-box{width:100%;font:inherit;font-size:20px;font-weight:700;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);min-height:110px;resize:none}
.accents{display:flex;gap:8px;flex-wrap:wrap}
.accents button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:10px;min-width:42px;padding:4px 8px;font-size:18px;font-weight:800}
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.checkbar .in{max-width:528px;margin:0 auto;display:grid;gap:14px}
.checkbar.ok{background:var(--ok-bg);border-color:transparent}
.checkbar.bad{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .ico{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.fb .ico svg{width:32px;height:32px}
.checkbar.ok .fb .ico{color:var(--ok)} .checkbar.bad .fb .ico{color:var(--bad)}
.fb .txt{min-width:0}
.fb h3{font-size:24px;font-weight:800}
.checkbar.ok .fb h3{color:var(--ok-deep)} .checkbar.bad .fb h3{color:var(--bad-deep)}
.checkbar.ok .fb p,.checkbar.bad .fb p{margin:2px 0 0;font-weight:700}
.checkbar.ok .fb p{color:var(--ok-deep)} .checkbar.bad .fb p{color:var(--bad-deep)}
.fb .note{font-weight:600!important;font-size:14px;color:var(--ink)!important;opacity:.85}

/* Fin de leçon */
.done{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:24px}
.done .mascot{width:150px;animation:jump .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes jump{0%{transform:translateY(30px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.done h2{font-size:36px;font-weight:800;color:var(--sun-deep)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.res{border-radius:16px;border:2px solid var(--rc);overflow:hidden;background:var(--rc)}
.res .h{color:var(--on);font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px}

const TIPS = {
  saludos: [['Le H est muet', "« Hola » se dit « ola ». Le H ne se prononce jamais en espagnol."],
            ['Les points à l\'envers', "Une question s'ouvre avec ¿ et une exclamation avec ¡ : « ¿Cómo estás? », « ¡Hola! »."],
            ['Tú ou usted ?', "« Tú » pour tes employés, tes amis, les enfants. « Usted » (le vouvoiement) pour un client, un inconnu, une personne âgée."]],
  herramientas: [['El, la, los, las', "« el » et « la » = le, la. Au pluriel : « los » et « las ». Les mots en -o sont presque toujours masculins, ceux en -a féminins."],
                 ['Le genre change parfois', "La vis devient « el tornillo », le ruban devient « la cinta ». Apprends toujours le mot avec son article."]],
  ordenes: [['Donner un ordre', "Pour dire à quelqu'un (tú) de faire quelque chose : verbes en -ar → -a (« Corta », « Espera »), verbes en -er/-ir → -e (« Mide »)."],
            ['Les irréguliers à connaître', "« Ven » (viens), « Ponte » (mets-toi), « Haz » (fais), « Ve » (va). Très utiles sur un chantier."],
            ['Adoucir', "Ajoute « por favor » : « Pásame el martillo, por favor ». Ça passe toujours mieux."]],
  tablaroca: [['Hay que… = il faut…', "« Hay que » + verbe à l'infinitif : « Hay que lijar » (il faut sabler), « Hay que esperar » (il faut attendre)."],
              ['Estar pour un état', "« Está mojado », « Está seco » : on utilise « estar » pour un état qui change."]],

  electricidad: [['Dire non', "« No » se place devant le verbe : « No hay corriente » (il n'y a pas de courant)."],

  pintura: [["L'adjectif suit le nom", "« la pared blanca » (le mur blanc). L'adjectif s'accorde : « el techo blanco », « la pared blanca »."]],

  tiempo: [["Dire l'heure", "« Son las siete » (il est sept heures), mais « Es la una » (il est une heure). « A las siete » = à sept heures."]],

  restaurante: [['Commander', "« Quiero… » (je veux) est normal au Mexique. Plus poli : « Me da… » (vous me donnez…) ou « Quisiera… » (je voudrais)."]],

const hasSpeech = 'speechSynthesis' in window;
let voices = [], voice = null;
function voiceScore(v) {
  const l = v.lang.replace('_', '-'), n = v.name;
  if (!/^es\b/i.test(l)) return -1;
  let s = /MX/i.test(l) ? 30 : /US|419/i.test(l) ? 26 : /-(CO|AR|CL|PE|VE|CR|UY|EC|GT|PR|DO)/i.test(l) ? 20 : 6;
  if (/natural|neural/i.test(n)) s += 100;
  if (/premium/i.test(n)) s += 95;
  if (/enhanced|améliorée|mejorada|optimizada/i.test(n)) s += 75;
  if (/google/i.test(n)) s += 65;
  if (/online/i.test(n)) s += 50;
  if (/eloquence|espeak|compact|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bells|Bubbles|Jester|Organ|Whisper|Zarvox|Trinoids|Bahh|Boing|Albert|Cellos|Wobble/i.test(n)) s -= 60;

}

let AC = null;
function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + 0.01;
    seq.forEach(([f, at, dur, type, vol]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol || 0.18, t0 + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + at + dur);
      o.connect(g).connect(AC.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
    });
  } catch (e) {}
}

function confetti(n) {

  const cv = $('#confetti'); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight, cx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--pink', '--teal', '--sun', '--blue'].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({ length: n || 120 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: pick(cols) }));
  const t0 = performance.now();
  (function frame(t) {
    cx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });

  })(t0);
}

/* ===================== CONSTRUCTION D'UNE LEÇON ===================== */
function weakness(it) { const p = S.progress[it.es]; return p ? p.box * 1e13 + p.due : -1; }
function distractors(it, field, n) {
  const same = ALL.filter(o => o !== it && isSentence(o) === isSentence(it) && loose(o[field]) !== loose(it[field]));
  return shuffle(same.filter(o => o.unit === it.unit)).concat(shuffle(same.filter(o => o.unit !== it.unit))).slice(0, n);
}
/* Plus on monte d'étage, plus on écrit et on écoute au lieu de choisir */
function typesFor(it, floor) {
  const sp = hasSpeech, f = Math.min(floor, 3);
  if (isSentence(it)) return [
    ['build', 'build', 'fr2es'],
    ['build', sp ? 'listenBuild' : 'build', 'fr2es'],
    ['build', sp ? 'listenBuild' : 'build', 'type'],
    ['type', sp ? 'listenBuild' : 'type', 'build'],
  ][f];
  return [
    ['es2fr', 'fr2es', sp ? 'listen' : 'fr2es', 'fr2es'],
    ['fr2es', sp ? 'listen' : 'es2fr', 'type'],
    ['type', sp ? 'listen' : 'fr2es', 'fr2es', 'type'],
    ['type', 'type', sp ? 'listen' : 'type'],
  ][f];
}
function buildLesson(unit) {
  let pool, fresh = [];
  const floor = unit ? floorOf(unit) : 2;
  if (unit) {
    const unseen = unit.items.filter(it => !S.progress[it.es]);
    fresh = unseen.slice(0, 4);
    const seen = unit.items.filter(it => S.progress[it.es]).sort((a, b) => weakness(a) - weakness(b));
    pool = fresh.concat(seen.slice(0, 7 - fresh.length));
  } else {
    pool = dueItems().sort((a, b) => weakness(a) - weakness(b)).slice(0, 8);
  }
  const ex = fresh.map(it => ({ t:'intro', it }));
  const words = shuffle(pool.filter(it => !isSentence(it)));
  const rest = [];
  if (words.length >= 4) rest.push({ t:'match', items: words.slice(0, 4) });
  pool.forEach(it => {
    rest.push({ t: pick(typesFor(it, floor)), it });
    if (fresh.includes(it)) rest.push({ t: isSentence(it) ? 'build' : 'fr2es', it });
  });
  return { queue: ex.concat(shuffle(rest)), fresh, floor };
}

  const picked = [], line = $('#line');
  const draw = () => {
    line.innerHTML = picked.map((i, n) => `<button class="tile" data-n="${n}">${esc(bank[i])}</button>`).join('');
    line.querySelectorAll('.tile').forEach(t => t.onclick = () => {

}

/* ===================== FIN DE LEÇON ET RÉCOMPENSES ===================== */
function finish() {

  Object.entries(L.results).forEach(([es, ok]) => { const it = ALL.find(x => x.es === es); if (it) grade(it, ok); });
  const firstTry = L.queue.filter(x => !x.retry).length;
  const perfect = L.correct === L.answered;
  const rewards = [];

  if (boostOn()) xp *= 2;

  t.bestCombo = Math.max(t.bestCombo, L.best); t.typed += L.typed; t.listen += L.listen; t.newWords += L.fresh.length;
  if (perfect) t.perfect++;

  if (new Date().getHours() < 7) S.stats.early++;
  const gain = perfect ? 10 : 5; S.pesos += gain;
  const today = dayKey();

  if (L.unit) S.done[L.unit.id] = L.exam ? Math.max(S.done[L.unit.id] || 0, FLOORS * LPF) : (S.done[L.unit.id] || 0) + 1;
  if (L.exam) { S.stats.exams = (S.stats.exams || 0) + 1; rewards.push(['crown', 'sun', 'Examen réussi', `${L.unit.fr} : toit posé d'un coup`]); }

  todaysQuests().filter(q => questDone(q) && !questsBefore.includes(q.id)).forEach(q => rewards.push(['target', 'pink', `Défi réussi : ${q.txt}`, `Va chercher tes ${q.r} pesos dans Défis`]));
  checkBadges().forEach(b => rewards.push([b[3], b[4], `Trophée : ${b[1]}`, b[2]]));
  const lvAfter = levelInfo(S.xp).lv;
  save();

  const acc = Math.round(L.firstOk / firstTry * 100);
  const lessonUnit = L.unit;
  L = null;
  $('#lesson').hidden = true; $('#done').hidden = false;
  $('#done').innerHTML = `<div class="done">
    ${mascot('wow')}
    <h2>${perfect ? '¡Sin errores!' : '¡Lección terminada!'}</h2>
    <div class="tiles3">
      <div class="res" style="--rc:var(--sun-deep)"><div class="h">XP${boostOn() ? ' ×2' : ''}</div><div class="v">${ic('bolt')}<span data-count="${xp}">0</span></div></div>
      <div class="res" style="--rc:var(--ok)"><div class="h">Précision</div><div class="v"><span data-count="${acc}">0</span>%</div></div>
      <div class="res" style="--rc:var(--teal)"><div class="h">Pesos</div><div class="v">${ic('peso')}<span data-count="${gain}">0</span></div></div>
    </div>
    ${rewards.length ? `<div class="rewards">${rewards.map((r, i) => `<div class="reward-item" style="--bc:var(--${r[1]});--bd:var(--${r[1]}-deep);animation-delay:${.5 + i * .15}s"><div class="medal">${ic(r[0])}</div><div style="min-width:0"><b>${esc(r[2])}</b><small>${esc(r[3])}</small></div></div>`).join('')}</div>` : ''}
    <button class="btn wide" id="back" style="max-width:360px">Continuer</button></div>`;
  window.scrollTo(0, 0);
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    (function f(t) { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);

    } else showHome();

}

/* ===================== DÉFI ÉCLAIR ===================== */
let A = null;
function arcadePool() {
  const open = UNITS.filter((u, i) => unlocked(i)).flatMap(u => u.items).filter(it => !isSentence(it));
  const seen = open.filter(it => S.progress[it.es]);
  return seen.length >= 8 ? seen : open.length >= 8 ? open : ALL.filter(it => !isSentence(it)).slice(0, 24);
}
function openArcade(target) {
  A = { target: target && target.score != null ? target : null, pool: arcadePool(), score: 0, combo: 0, best: 0, ends: Date.now() + 60000, lock: false, timer: null, answered: 0, right: 0, last: null };
  $('#home').hidden = true; $('#tabs').hidden = true; $('#arcade').hidden = false;
  SFX.tap(); window.scrollTo(0, 0); arcadeQ();
  A.timer = setInterval(arcadeTick, 100);
}
function arcadeTick() {
  if (!A) return;
  const left = Math.max(0, A.ends - Date.now());
  const bar = $('#arc-bar'), tm = $('#arc-time');
  if (bar) { bar.style.width = (left / 600) + '%'; bar.style.setProperty('--c', left < 10000 ? 'var(--bad)' : 'var(--sun)'); }
  if (tm) { tm.textContent = Math.ceil(left / 1000); tm.classList.toggle('low', left < 10000); }
  if (left <= 0) arcadeEnd();
}
function arcadeQ() {
  let it; do { it = pick(A.pool); } while (A.pool.length > 1 && it === A.last);
  A.last = it; A.lock = false;
  const toFr = Math.random() < 0.5, field = toFr ? 'fr' : 'es';
  const opts = shuffle([it, ...distractors(it, field, 3)]);
  $('#arcade').innerHTML = `<div class="arc-top"><button class="x" id="arc-quit" aria-label="Quitter le Défi éclair">${ic('close')}</button>
      <div class="pbar" style="flex:1"><i id="arc-bar" style="width:${Math.max(0, A.ends - Date.now()) / 600}%"></i></div><div class="arc-time" id="arc-time">${Math.ceil(Math.max(0, A.ends - Date.now()) / 1000)}</div></div>
    <div class="arc-score"><b>${A.score}</b><span>${A.combo >= 3 ? `combo ×${A.combo}` : 'points'}</span></div>
    <div class="arc-q"><span class="dir">${toFr ? 'En français ?' : 'En espagnol ?'}</span><span class="w">${esc(toFr ? it.es : it.fr)}</span></div>
    <div class="arc-grid">${opts.map((o, i) => `<button class="opt" data-a="${i}">${esc(o[field])}</button>`).join('')}</div>`;
  $('#arc-quit').onclick = () => { clearInterval(A.timer); A = null; $('#arcade').hidden = true; showHome(); };
  $('#arcade').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if (A.lock) return; A.lock = true; A.answered++;
    const ok = opts[+b.dataset.a] === it;
    if (ok) {
      A.combo++; A.best = Math.max(A.best, A.combo); A.right++;
      A.score += 1 + Math.floor(A.combo / 5);
      b.classList.add('right'); tone([[700 + Math.min(A.combo, 12) * 40, 0, .08, 'triangle', .14]]);
      setTimeout(() => A && arcadeQ(), 180);
    } else {
      A.combo = 0; A.ends -= 3000; SFX.bad();
      b.classList.add('wrong');
      $('#arcade').querySelectorAll('[data-a]').forEach(x => { if (opts[+x.dataset.a] === it) x.classList.add('right'); });
      const pen = document.createElement('div'); pen.className = 'arc-penalty'; pen.textContent = '−3 s'; document.body.appendChild(pen); setTimeout(() => pen.remove(), 1000);
      setTimeout(() => A && arcadeQ(), 750);
    }
  });
}
function arcadeEnd() {
  clearInterval(A.timer);
  const a = A; A = null;
  const lvBefore = levelInfo(S.xp).lv;
  const record = a.score > (S.arcadeBest || 0);
  if (record) S.arcadeBest = a.score;
  let xp = Math.min(40, a.score); if (boostOn()) xp *= 2;
  const gain = Math.floor(a.score / 4);
  addXp(xp); S.pesos += gain;
  const t = T(); t.arcade = (t.arcade || 0) + 1; t.bestCombo = Math.max(t.bestCombo, a.best);
  S.stats.bestCombo = Math.max(S.stats.bestCombo, a.best);
  const today = dayKey();
  if (S.lastDay !== today) { S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = today; }
  if (a.target && a.score > a.target.score) { S.stats.challengesWon = (S.stats.challengesWon || 0) + 1; S.challenge = null; }
  const nb = checkBadges(); save();
  const acc = a.answered ? Math.round(a.right / a.answered * 100) : 0;
  $('#arcade').innerHTML = `<div class="done">${mascot(record ? 'wow' : 'happy')}
    <h2>${a.target ? (a.score > a.target.score ? '¡Ganaste!' : '¡Casi!') : record ? '¡Nuevo récord!' : '¡Tiempo!'}</h2>
    ${a.target ? `<p style="margin:0;font-weight:800;color:var(--muted)">${a.score > a.target.score ? `Tu as battu ${esc(a.target.from)} (${a.target.score} points) !` : `Encore ${a.target.score - a.score + 1} points pour battre ${esc(a.target.from)}.`}</p>` : ''}
    <div class="tiles3">
      <div class="res" style="--rc:var(--sun-deep)"><div class="h">Points</div><div class="v">${a.score}</div></div>
      <div class="res" style="--rc:var(--pink)"><div class="h">Record</div><div class="v">${S.arcadeBest}</div></div>
      <div class="res" style="--rc:var(--ok)"><div class="h">Précision</div><div class="v">${acc}%</div></div>
    </div>
    <div class="rewards"><div class="reward-item" style="--bc:var(--sun);--bd:var(--sun-deep)"><div class="medal">${ic('bolt')}</div><div><b>+${xp} XP · +${gain} pesos</b><small>Meilleur combo : ${a.best}</small></div></div>
    ${nb.map((b, i) => `<div class="reward-item" style="--bc:var(--${b[4]});--bd:var(--${b[4]}-deep);animation-delay:${.3 + i * .15}s"><div class="medal">${ic(b[3])}</div><div><b>Trophée : ${esc(b[1])}</b><small>${esc(b[2])}</small></div></div>`).join('')}</div>
    <div style="display:grid;gap:12px;width:100%;max-width:360px"><button class="btn sun wide" id="arc-again">Rejouer</button>${a.score > 0 ? `<button class="btn blue wide" id="arc-dare">${a.target ? 'Renvoyer le défi' : 'Défier un ami'}</button>` : ''}<button class="btn line wide" id="arc-done">Terminer</button></div></div>`;
  record ? (SFX.level(), confetti(180)) : SFX.win();
  const lv = levelInfo(S.xp).lv;
  const out = () => { $('#arcade').hidden = true; showHome(); };
  $('#arc-again').onclick = () => openArcade(a.target && a.score <= a.target.score ? a.target : null);
  const dare = $('#arc-dare'); if (dare) dare.onclick = () => challengeModal(a.score);
  $('#arc-done').onclick = () => lv > lvBefore ? (SFX.level(), modal(`${mascot('wow')}<span class="eyebrow">Niveau supérieur</span><h2>Niveau ${lv}</h2><p>${esc(titleOf(lv))}</p>`, out)) : out();
}

   prompt:"Tu es Luis, un jeune aide (ayudante) un peu distrait qui travaille sans casque ni lunettes. L'apprenant est ton patron et doit te rappeler les règles de sécurité. Réagis, pose des questions, promets de faire attention."},
  {id:'resto', title:'Au restaurant', sub:'Commande ton souper à Cancún', icon:'cup', color:'pink', who:'Mesero · Cancún',
   prompt:"Tu es serveur dans un petit restaurant de Cancún. L'apprenant est un touriste québécois. Vouvoie-le (usted). Accueille-le, propose les boissons et les plats du jour, puis apporte l'addition quand il la demande."},
  {id:'taxi', title:'Le taxi', sub:"De l'aéroport à l'hôtel", icon:'plane', color:'teal', who:'Taxista · Ciudad de México',
   prompt:"Tu es chauffeur de taxi à l'aéroport de Mexico. Vouvoie le client (usted). Demande la destination, parle du trafic et du temps qu'il fait, annonce le prix."},
  {id:'libre', title:'Jase libre', sub:'Parle de ta journée avec Paco', icon:'chat', color:'blue', who:'Paco · ton ami mexicain',
   prompt:"Tu es Paco, un ami mexicain jovial. Discute avec lui de sa journée, de son travail en rénovation, de sa famille, de ses prochaines vacances."},
];
let SAMPLE = null, sampleState = 'pending'; // pending | on | off
async function connectSample() {
  if (!window.claude || !window.claude.use) { sampleState = 'off'; if (!$('#home').hidden && tab === 'tutor') render(); return; }
  try { SAMPLE = await claude.use('sample'); } catch (e) { SAMPLE = null; }
  sampleState = SAMPLE ? 'on' : 'off';
  if (!$('#home').hidden && (tab === 'tutor' || tab === 'quests')) render();
}
function tutorView() {
  let h = `<div class="tutor-hero">${mascot('happy')}<div><h2>Jase avec Paco</h2><p>Une vraie conversation en espagnol. Paco joue le rôle, corrige tes erreurs en français et te suggère quoi répondre.</p></div></div>`;
  if (sampleState === 'off') return h + `<div class="notice"><b>Paco vit dans la version Claude</b>Pour jaser avec lui, ouvre <a href="https://claude.ai/artifact/QaFHyNq7GL9gU8zHT5Z8EB" target="_blank" rel="noopener" style="color:var(--blue);font-weight:800">Paso a Paso dans Claude</a>. Le reste de l'app fonctionne ici normalement.</div>`;
  if (sampleState === 'pending') h += `<p style="color:var(--muted);font-weight:700">Connexion au tuteur…</p>`;
  h += `<h2 class="section-title">Sur le chantier</h2><div class="scenes">${SCENES.slice(0, 4).map(sceneCard).join('')}</div>
    <h2 class="section-title">En voyage et ailleurs</h2><div class="scenes">${SCENES.slice(4).map(sceneCard).join('')}</div>
    <p style="color:var(--muted);font-size:13px;font-weight:700;margin-top:16px">Chaque message rapporte 3 XP, 5 s'il est sans faute. Les réponses de Paco utilisent ton forfait Claude ; la première fois, Claude te demande ton accord.</p>`;
  return h;
}
const sceneCard = sc => `<button class="scene-card" data-scene="${sc.id}" style="--sc:var(--${sc.color});--sd:var(--${sc.color}-deep)" ${sampleState === 'on' ? '' : 'disabled'}>
  <div class="art"${sc.color === 'sun' ? ' style="color:var(--sun-ink)"' : ''}>${ic(sc.icon)}</div><div style="min-width:0"><b>${sc.title}</b><small>${sc.sub}</small></div><span class="go">${ic('arrow')}</span></button>`;

let CH = null;
function tutorRules(sc) {
  const known = ALL.filter(it => S.progress[it.es]).map(it => it.es).slice(-120).join(', ');
  return `Tu es Paco, tuteur d'espagnol pour un francophone du Québec, entrepreneur en rénovation résidentielle, débutant en espagnol (niveau A1). Il apprend l'espagnol d'Amérique latine (Mexique) pour parler avec ses employés hispanophones sur ses chantiers et pour voyager.

SCÈNE : ${sc.prompt}

RÈGLES :
- Joue ton rôle en espagnol du Mexique, avec des phrases très courtes et simples (1 ou 2 phrases, 15 mots maximum en tout), surtout au présent. Tutoie (tú) sauf si la scène dit usted.
- Réutilise en priorité le vocabulaire qu'il connaît déjà : ${known || 'quelques salutations'}.
- Termine chaque réplique par une question simple pour faire avancer la scène.
- Corrige son DERNIER message : s'il contient une vraie erreur d'espagnol (mot, accord, conjugaison, ordre), explique-la en une phrase EN FRANÇAIS et donne la phrase corrigée entre guillemets. Ignore les accents oubliés, les majuscules et les ¿ ¡ manquants. S'il écrit en français, donne-lui la façon de le dire en espagnol. Sinon, correction vide.
- Propose 3 réponses courtes et naturelles qu'il pourrait te donner ensuite, en espagnol simple, avec leur traduction française.

Réponds UNIQUEMENT avec un objet JSON, sans autre texte :
{"es":"ta réplique","fr":"sa traduction française","ok":true,"correction":"","suggestions":[{"es":"...","fr":"..."},{"es":"...","fr":"..."},{"es":"...","fr":"..."}]}
"ok" vaut false seulement si son dernier message contenait une vraie erreur ou était en français.`;
}
function openScene(sc) {
  if (!SAMPLE) return;
  CH = { sc, turns: [], view: [], busy: false, err: '', sugs: [], ctl: null };
  $('#home').hidden = true; $('#tabs').hidden = true; $('#chat').hidden = false;
  SFX.tap(); drawChat(); window.scrollTo(0, 0);
  ask('(Début de la scène : dis ta première réplique.)', null);
}
function closeChat() { if (CH && CH.ctl) CH.ctl.abort(); CH = null; if (hasSpeech) speechSynthesis.cancel(); $('#chat').hidden = true; showHome(); }
function drawChat() {
  const sc = CH.sc;
  let h = `<div class="chat-top"><button class="x" id="chat-close" aria-label="Quitter la conversation">${ic('close')}</button>
    <div class="t"><b>${sc.title}</b><small>${sc.who}</small></div></div><div class="msgs" id="msgs">`;
  CH.view.forEach((m, i) => {
    if (m.role === 'me') {
      h += `<div class="msg me"><div class="bub">${esc(m.text)}</div></div>`;
      if (m.corr === 'good') h += `<div class="corr good">${ic('check')}<span>¡Perfecto! Rien à corriger.</span></div>`;
      else if (m.corr) h += `<div class="corr fix">${ic('pencil')}<span>${esc(m.corr)}</span></div>`;
    } else {
      h += `<div class="msg tutor"><div class="av">${mascot('happy')}</div><div class="bub"><div class="es">${esc(m.es)}</div>
        ${m.showFr ? `<div class="tr">${esc(m.fr)}</div>` : ''}
        <div class="acts">${'' /* boutons */}<button class="mini" data-say="${esc(m.es)}">${ic('spk')}Écouter</button><button class="mini" data-say="${esc(m.es)}" data-slow="1">${ic('turtle')}Lent</button><button class="mini" data-tr="${i}">${m.showFr ? 'Cacher' : 'Traduire'}</button></div></div></div>`;
    }
  });
  if (CH.busy) h += `<div class="msg tutor"><div class="av">${mascot('happy')}</div><div class="bub"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  if (CH.err) h += `<div class="chat-err">${esc(CH.err)}</div>`;
  h += `</div><div style="height:${CH.sugs.length ? 190 : 120}px"></div>
    <div class="composer"><div class="in">
      ${CH.sugs.length ? `<div class="sugs">${CH.sugs.map((s, i) => `<button class="sug" data-sug="${i}"><b>${esc(s.es)}</b><small>${esc(s.fr)}</small></button>`).join('')}</div>` : ''}
      <div class="accents">${['á','é','í','ó','ú','ñ','¿','¡'].map(c => `<button type="button" data-ch="${c}">${c}</button>`).join('')}</div>
      <div class="crow"><textarea id="chat-input" rows="1" lang="es" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Écris en espagnol (ou en français si tu bloques)"></textarea>
      <button class="btn blue" id="chat-send" aria-label="Envoyer" ${CH.busy ? 'disabled' : ''}>${ic('send').replace('<svg', '<svg style="width:22px;height:22px;display:block"')}</button></div>
    </div></div>`;
  const draft = $('#chat-input') ? $('#chat-input').value : '';
  $('#chat').innerHTML = h;
  const inp = $('#chat-input'); inp.value = draft;
  $('#chat-close').onclick = closeChat;
  $('#chat-send').onclick = sendChat;
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } };
  $('#chat').querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    const s0 = inp.selectionStart ?? inp.value.length, e0 = inp.selectionEnd ?? s0;
    inp.value = inp.value.slice(0, s0) + b.dataset.ch + inp.value.slice(e0); inp.focus(); inp.setSelectionRange(s0 + 1, s0 + 1);
  });
  $('#chat').querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { const s = CH.sugs[+b.dataset.sug]; inp.value = s.es; say(s.es); inp.focus(); });
  $('#chat').querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { const m = CH.view[+b.dataset.tr]; m.showFr = !m.showFr; drawChat(); });
  window.scrollTo(0, document.body.scrollHeight);
}
function sendChat() {
  if (!CH || CH.busy) return;
  const inp = $('#chat-input'); const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const mine = { role: 'me', text, corr: '' };
  CH.view.push(mine); SFX.tap();
  ask(text, mine);
}
const SAMPLE_ERR = {
  not_granted: "Paco n'a pas l'autorisation d'utiliser Claude. Recharge la page et accepte la demande pour jaser avec lui.",
  sampling_disabled: "Claude n'est pas disponible pour ce compte.",
  rate_limited: 'Paco a besoin d\'une pause : trop de messages d\'un coup ou limite d\'usage atteinte. Réessaie dans un moment.',
  session_expired: 'Ta session Claude a expiré. Reconnecte-toi puis reviens ici.',
  refused: 'Paco ne peut pas répondre à ce message. Essaie autrement.',
  invalid_json: 'Paco s\'est mélangé dans sa réponse. Renvoie ton message.',
};
async function ask(text, mine) {
  CH.turns.push({ role: 'user', content: text });
  CH.busy = true; CH.err = ''; CH.sugs = []; drawChat();
  const ch = CH; ch.ctl = new AbortController();
  const recent = ch.turns.slice(-16);
  if (recent[0].role !== 'user') recent.shift();
  try {
    const r = await SAMPLE.json([{ role: 'user', content: tutorRules(ch.sc) }, ...recent], { modelTier: 'quick', cache: false, signal: ch.ctl.signal });
    if (CH !== ch) return;
    const es = String(r && r.es || '').trim();
    if (!es) throw { code: 'invalid_json' };
    const reply = { es, fr: String(r.fr || ''), ok: r.ok !== false, correction: String(r.correction || '').trim(),
      suggestions: Array.isArray(r.suggestions) ? r.suggestions.filter(x => x && x.es).slice(0, 3).map(x => ({ es: String(x.es), fr: String(x.fr || '') })) : [] };
    ch.turns.push({ role: 'assistant', content: JSON.stringify(reply) });
    ch.view.push({ role: 'tutor', es: reply.es, fr: reply.fr, showFr: false });
    ch.sugs = reply.suggestions;
    if (mine) {
      mine.corr = reply.ok && !reply.correction ? 'good' : (reply.correction || '');
      rewardTutor(reply.ok && !reply.correction);
    }
    ch.busy = false; drawChat();
    setTimeout(() => say(reply.es), 200);
  } catch (e) {
    if (CH !== ch) return;
    ch.turns.pop();
    if (mine) { const i = ch.view.indexOf(mine); if (i >= 0) ch.view.splice(i, 1); }
    ch.busy = false;
    if (e && e.code === 'cancelled') return;
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) sampleState = 'off';
    ch.err = SAMPLE_ERR[e && e.code] || 'La connexion avec Paco a été coupée. Renvoie ton message.';
    drawChat();
    if (mine) $('#chat-input').value = mine.text;
  }
}
function rewardTutor(clean) {
  const lvBefore = levelInfo(S.xp).lv, t = T();
  let xp = clean ? 5 : 3; if (boostOn()) xp *= 2;
  addXp(xp); t.tutor = (t.tutor || 0) + 1; S.stats.tutor++;
  const today = dayKey();
  if (S.lastDay !== today) { S.streak = S.lastDay === yesterday() ? S.streak + 1 : 1; S.lastDay = today; }
  const nb = checkBadges(); save();
  clean ? SFX.ok() : SFX.tap();
  const f = document.createElement('div'); f.className = 'xpfloat'; f.textContent = '+' + xp + ' XP'; document.body.appendChild(f); setTimeout(() => f.remove(), 1300);
  if (nb.length) toast('Trophée débloqué : ' + nb[0][1]);
  const lv = levelInfo(S.xp).lv;
  if (lv > lvBefore) { SFX.level(); confetti(160); modal(`${mascot('wow')}<span class="eyebrow">Niveau supérieur</span><h2>Niveau ${lv}</h2><p>${esc(titleOf(lv))}</p>`); }
}

function showHome() {
  $('#lesson').hidden = true; $('#done').hidden = true; $('#home').hidden = false; $('#tabs').hidden = false;
  render(); window.scrollTo(0, 0);
}
readInviteParams();
render();
connectCloud();
connectSample();
setInterval(() => { if (!$('#home').hidden && boostOn()) render(); }, 60000);
</script>
